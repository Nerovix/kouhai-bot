# Kouhai Bot 配置文件示例
# 复制此文件为 config.yaml 并填入你的配置
# config.yaml 已在 .gitignore 中，不会被提交

# ── QQ Bot 配置 ──
bot_qq: 123456789  # 你的 Bot QQ 号

# ── NapCat 连接配置 ──
# Bot 通过 WebSocket 连接到 NapCat
napcat_ws_host: "0.0.0.0"  # 如果 NapCat 在 Docker 中运行，必须是 0.0.0.0
napcat_ws_port: 8097       # WebSocket 监听端口
napcat_http_host: "127.0.0.1"  # NapCat HTTP API 地址
napcat_http_port: 3000     # NapCat HTTP API 端口

# ── LLM 配置 ──
# Bot 使用三个模型队列，按顺序尝试每个 provider
# 每个队列可以配置多个 provider，失败时自动 fallback
llm:
  # ── smart_model：判题和复盘 ──
  # 用于 /submit 判题和 /review 复盘
  # 需要强推理能力，建议使用顶级模型
  smart_model:
    - name: "openai"
      api_key: "sk-..."
      base_url: "https://api.openai.com/v1"
      model: "gpt-5.6"
      reasoning_effort: "high"  # 推理强度：low/medium/high/xhigh
      model_tag: "『GPT5.6』"   # 显示在回复末尾的标记
      stream: true              # 使用 SSE 流式传输（推荐）
    
    # 备选 provider
    # - name: "deepseek"
    #   api_key: "sk-..."
    #   base_url: "https://api.deepseek.com/v1"
    #   model: "deepseek-v4-pro"
    #   reasoning_effort: "high"
    #   model_tag: "『DSv4pro』"
    #   stream: true

  # ── general_model：摘要、澄清、题解爬取 ──
  # 用于题面摘要、样例解释、题解爬取、/clarify 题意澄清
  # 可以使用更便宜的模型
  general_model:
    - name: "openai"
      api_key: "sk-..."
      base_url: "https://api.openai.com/v1"
      model: "gpt-5.6-mini"
      model_tag: "『GPT5.6mini』"
      stream: true
    
    # 备选 provider
    # - name: "qwen"
    #   api_key: "sk-..."
    #   base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    #   model: "qwen-max"
    #   model_tag: "『Qwen』"
    #   stream: true  # DashScope 自动使用 SSE

  # ── multimodal_model：处理带图片的题面（可选） ──
  # 用于处理包含公式图、示意图的 Codeforces 题面
  # 如果不配置，带图题会被跳过
  # 注意：即使 general_model 配置的是多模态模型，也必须在这里单独配置一次
  # 因为 multimodal 任务只会路由到 multimodal_model，不会 fallback 到 general_model
  multimodal_model:
    - name: "openai"
      api_key: "sk-..."
      base_url: "https://api.openai.com/v1"
      model: "gpt-5.6-vision"
      model_tag: "『GPT5.6v』"
      stream: true

# ── 群聊配置 ──
current_group: 987654321  # 服务的 QQ 群号

# ── 题目选择 ──
problem:
  min_rating: 2600  # 最低难度
  max_rating: 2800  # 最高难度
  newproblem_cooldown: 60  # /newproblem 冷却时间（秒）

# ── 打星用户（可选） ──
# 将某些用户从正式榜中踢出，单独记榜
# user_groups:
#   - name: "starred"
#     display_name: "打星"
#     user_ids: [123456789, 987654321]
#     submit_delay_sec: 1800  # 题目公布后 30 分钟内无法提交

# ── 宵禁（可选） ──
# 在指定时间段内禁止 /submit
# curfew:
#   start_hour: 23  # 开始时间（24小时制）
#   duration_hours: 8  # 持续时间（小时）
