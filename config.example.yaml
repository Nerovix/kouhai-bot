# Kouhai Bot 配置文件示例
# 复制此文件为 config.yaml 并填入你的配置
# config.yaml 已在 .gitignore 中，不会被提交
# 切勿把真实 app_secret / api_key / 群号 提交进 git。

# ── 官方 QQ 机器人 API（必填） ──
# 在 QQ 机器人开发者控制台 (q.qq.com) 创建机器人后获得 AppID / AppSecret。
# 凭证也可用环境变量 KOUHAI_APP_ID / KOUHAI_APP_SECRET 提供（优先级低于此处显式值）。
official:
  app_id: "1900000000"           # 机器人 AppID（占位符，替换为你自己的）
  app_secret: "your-app-secret"  # 机器人 AppSecret（占位符）
  bot_name: "KouhaiBot"           # 卡片署名兜底名；网关 READY 的 username 为权威，会自动覆盖
  # bot_avatar_url: ""            # bot 真实头像 URL（官方 API 不下发 bot 头像，需自行填入；
                                 # 留空则渲染首字母色圆。READY 的 bot id 拼 QQ 头像 URL 只会得到默认企鹅）
  sandbox: false                 # 沙箱环境官方已基本废弃（管理员可直接体验测试），一般保持 false
  # api_base: "https://api.bot.qq.com"      # 默认 REST 域名（2026-08-10 起官方统一为此域名）
  # token_base: "https://api.bot.qq.com"    # 默认 access_token 域名
  # intents: 117440512           # 默认 群+C2C(1<<25) | 互动(1<<26) | 群成员(1<<24)
                                 # 热迁移按昵称即时匹配老用户，需要群开启「获取群内全部消息」(GROUP_MESSAGE_CREATE)

# ── LLM 配置 ──
# Bot 使用两个模型队列，按顺序尝试每个 provider，失败自动 fallback。
# 所有 provider 均使用 OpenAI 兼容 /chat/completions 接口。
llm:
  max_retries: 2                 # 每个 provider 内部重试次数
  retry_base_delay_sec: 1.0      # 指数退避基数
  retry_max_delay_sec: 8.0       # 退避上限
  judge_timeout_sec: 1200        # 判题超时
  clarify_timeout_sec: 600       # 澄清超时
  review_timeout_sec: 600        # 复盘超时
  summary_timeout_sec: 120       # 摘要 / 题解翻译超时

  # ── smart_model：判题 (/sbm) 和复盘 (/rv) ──
  # 需要强推理能力，建议使用顶级模型。不要降低 reasoning_effort。
  smart_model:
    - name: "openai"
      api_key: "sk-..."
      base_url: "https://api.openai.com/v1"
      model: "gpt-5.6"
      reasoning_effort: "high"   # 推理强度：low/medium/high/xhigh/max
      model_tag: "『GPT5.6』"     # 显示在回复末尾的标记
      stream: true               # 使用 SSE 流式传输（推荐）

    # 备选 provider
    # - name: "deepseek"
    #   api_key: "sk-..."
    #   base_url: "https://api.deepseek.com/v1"
    #   model: "deepseek-v4-pro"
    #   reasoning_effort: "high"
    #   model_tag: "『DSv4pro』"
    #   stream: true

  # ── general_model：判题复盘之外的一切 ──
  # 题面摘要、样例解释、题解爬取翻译、/clrf（含带图题面）、JSON 修复等。
  # 可以用更便宜的模型，但**必须支持图片输入 (vision)**：
  # 带图题面（公式图、示意图）的摘要、样例解释和澄清也走这个队列。
  general_model:
    - name: "openai"
      api_key: "sk-..."
      base_url: "https://api.openai.com/v1"
      model: "gpt-5.6-vision"
      model_tag: "『GPT5.6v』"
      stream: true

    # 备选 provider
    # - name: "qwen"
    #   api_key: "sk-..."
    #   base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    #   model: "qwen-vl-max"
    #   model_tag: "『QwenVL』"
    #   stream: true  # DashScope/百炼 自动使用 SSE

    # deepseek-flash 兜底注意：它在 response_format=json_object 结构化输出模式下
    # 会高频（实测约 75%）退化成纯空白 content（finish_reason=stop），导致 clarify
    # 等 JSON 任务兜底失败。设 send_response_format: false 关掉该模式即可稳定——
    # clarify/summary 的 prompt 本就要求输出 JSON，另有 robust JSON 解析兜底。
    # - name: "deepseek"
    #   api_key: "sk-..."
    #   base_url: "https://api.deepseek.com/v1"
    #   model: "deepseek-flash"
    #   model_tag: "『🐳』"
    #   send_response_format: false

# ── 题目选择（全局默认难度） ──
# 每个群可用 /range 指令覆盖本群难度区间（任何群友可设）。
problem:
  min_rating: 2600               # 全局最低难度
  max_rating: 2800               # 全局最高难度
  newproblem_cooldown: 300       # /np 冷却时间（秒）
  # submit_ac_backdoor: ""       # 非空时，包含该字符串的 /sbm 直接判对（调试用）

# ── 数据目录 ──
# SQLite 数据库 (kouhai.db)、题面缓存镜像、题解、日志、pidfile 都在此目录下。
# data_dir: "~/.kouhai-bot"

# ── 旧数据热迁移（仅旧服务群） ──
# 官方 openid 只在成员互动时下发、无 roster/history 接口，故按访问热迁移：
# 每收到一条服务群消息捕获 openid+群昵称，匹配旧 QQ 号后即刻迁该成员的旧群数据。
# 私聊数据不迁。source_db 为整理脚本产出的本地运行时文件（含真实 QQ/昵称，绝不提交）。
# legacy_migration:
#   enabled: false
#   group_openid: "<旧服务群的 group_openid>"
#   source_db: "/path/to/legacy_source.db"

# ── 以下旧字段已废弃，官方多群架构不再使用，保留仅为兼容旧配置解析 ──
# bot_qq / current_group：官方按群 openid 惰性发现服务群，无需预配置群号。
# napcat_*：NapCat 传输层已移除。
# user_groups（打星）/ curfew（宵禁）/ jev（娱乐判题）：功能已移除。